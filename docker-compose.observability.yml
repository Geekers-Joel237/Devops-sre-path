version: '3.8'

services:
  # --- Service de Visualisation ---
  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  # --- Service d'Agrégation de Logs ---
  loki:
    image: grafana/loki:latest
    container_name: obs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # --- Agent de Collecte de Logs ---
  promtail:
    image: grafana/promtail:latest
    container_name: obs-promtail
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
